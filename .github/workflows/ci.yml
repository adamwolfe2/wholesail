name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/wholesail"
      # Placeholder Clerk key in valid publishable-key format (base64 of "clerk.example.com$").
      # Clerk validates the format at build time; "pk_test_placeholder" fails prerendering.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
      CLERK_SECRET_KEY: "sk_test_placeholder"
      CLERK_WEBHOOK_SECRET: "whsec_placeholder"
      CRON_SECRET: "ci-placeholder"
      ANTHROPIC_API_KEY: "ci-placeholder"
      WS_VERCEL_TOKEN: "ci-placeholder"
      BOOTSTRAP_SECRET: "ci-placeholder"
      # NEXT_PUBLIC_APP_URL is intentionally unset: portal-config tests assert
      # the default appUrl, and the build falls back to it as well.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # 'pnpm build' runs 'prisma migrate deploy', which needs a database and
      # currently fails on any fresh one (the 0_init migration file is corrupted
      # by stray dotenv output and conflicts with the later migrations).
      # CI validates the Next.js build and tests, which need no database;
      # migrations run at deploy time against the real database.
      - name: Build
        run: pnpm exec next build

      - name: Test
        run: pnpm test
